name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shams
          POSTGRES_PASSWORD: shams
          POSTGRES_DB: shams_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shams" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shams:shams@localhost:5432/shams_dev?schema=public
      TEST_DATABASE_URL: postgresql://shams:shams@localhost:5432/shams_test?schema=public
      APP_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      IP_HASH_SALT: ci-salt
      PAYMENT_SANDBOX_ENABLED: "true"
      PAYMENT_SANDBOX_SECRET: ci-sandbox-secret
      SEED_OWNER_PASSWORD: Ci-Owner-Password-2026!
      SEED_STAFF_PASSWORD: Ci-Staff-Password-2026!
      E2E_STAFF_PASSWORD: Ci-Owner-Password-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=shams psql -h localhost -U shams -d shams_dev -c "CREATE DATABASE shams_test"
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - run: npm run build
      - name: Seed demo data
        run: npm run db:seed
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end acceptance tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
